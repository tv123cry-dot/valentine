<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dress Up Date Game 💖</title>
  <style>
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}

    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      background:linear-gradient(135deg,#ffdde1,#ee9ca7);
    }

    .card{
      width:min(900px,95vw);
      background:rgba(255,255,255,.9);
      border-radius:20px;
      box-shadow:0 20px 50px rgba(0,0,0,.2);
      padding:20px;
    }

    h1{text-align:center;margin:5px 0 15px}

    .screen{display:none}
    .screen.active{display:block}

    /* Character */
    .game{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    @media(max-width:700px){
      .game{grid-template-columns:1fr}
    }

    .character-wrap{
      display:grid;place-items:center;
      background:#ffe4ec;
      border-radius:16px;
      padding:20px;
    }

    .character{
      position:relative;
      width:180px;
      height:300px;
      background:#ffd1dc;
      border-radius:90px 90px 40px 40px;
      overflow:hidden;
      box-shadow:inset 0 0 0 3px rgba(0,0,0,.1);
    }

    /* Face */
    .face{
      position:absolute;top:40px;left:50%;transform:translateX(-50%);
      width:120px;height:90px;border-radius:50%;background:#ffefef;
    }
    .eye{width:12px;height:12px;background:#333;border-radius:50%;position:absolute;top:30px}
    .eye.left{left:35px}
    .eye.right{right:35px}
    .mouth{width:30px;height:14px;border-bottom:3px solid #444;border-radius:0 0 30px 30px;position:absolute;bottom:20px;left:50%;transform:translateX(-50%)}

    /* Clothes layers */
    .hair,.top,.bottom,.shoes{position:absolute;left:0;width:100%}

    .hair{top:0;height:80px}
    .top{top:110px;height:90px}
    .bottom{top:190px;height:70px}
    .shoes{bottom:0;height:40px}

    /* Hair styles */
    .hair.short{background:#6b4b3e}
    .hair.long{background:linear-gradient(#3b2a20,#6b4b3e)}
    .hair.curly{background:repeating-radial-gradient(circle at top,#5a3a2b 0 8px,#3b2418 9px 14px)}

    /* Tops */
    .top.tee{background:#60a5fa}
    .top.hoodie{background:#22c55e}
    .top.dress{background:linear-gradient(#fb7185,#f43f5e)}

    /* Bottoms */
    .bottom.jeans{background:#1e40af}
    .bottom.skirt{background:#f472b6}
    .bottom.shorts{background:#a855f7}

    /* Shoes */
    .shoes.sneakers{background:#444}
    .shoes.boots{background:#78350f}
    .shoes.heels{background:#111}

    /* Options */
    .options{
      display:grid;
      gap:16px;
    }

    .group{
      background:#fff0f5;
      padding:12px;
      border-radius:12px;
    }

    .group h3{margin:0 0 8px;font-size:16px}

    .group button{
      margin:4px;
      padding:6px 10px;
      border:none;border-radius:999px;
      background:#fff;cursor:pointer;font-weight:600;
      box-shadow:0 2px 6px rgba(0,0,0,.15);
    }

    .group button.active{background:#fb7185;color:white}

    .next{
      margin-top:10px;
      padding:12px 18px;
      border:none;border-radius:999px;
      background:#22c55e;color:white;font-size:16px;font-weight:700;
      cursor:pointer;
      width:100%;
    }

    /* Date screen */
    .date{
      text-align:center;
      padding:20px;
    }

    .scene{
      margin:15px auto;
      width:100%;max-width:500px;height:220px;
      border-radius:16px;
      background:linear-gradient(#60a5fa,#fde68a);
      position:relative;overflow:hidden;
    }

    .sun{width:60px;height:60px;background:#fde047;border-radius:50%;position:absolute;top:15px;right:20px}
    .ground{position:absolute;bottom:0;left:0;width:100%;height:60px;background:#22c55e}

    .date-char{
      position:absolute;bottom:40px;left:50%;transform:translateX(-50%) scale(.7);
    }

    .restart{
      margin-top:15px;
      padding:10px 16px;
      border:none;border-radius:999px;
      background:#3b82f6;color:white;font-weight:700;cursor:pointer;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Dress Up & Go On a Date 💕</h1>

  <!-- Screen 1: Dress Up -->
  <div class="screen active" id="dressScreen">
    <div class="game">

      <!-- Character -->
      <div class="character-wrap">
        <div class="character" id="character">

          <div class="hair short" id="hair"></div>

          <div class="face">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="mouth"></div>
          </div>

          <div class="top tee" id="top"></div>
          <div class="bottom jeans" id="bottom"></div>
          <div class="shoes sneakers" id="shoes"></div>
        </div>
      </div>

      <!-- Options -->
      <div class="options">

        <div class="group">
          <h3>Hair</h3>
          <button data-type="hair" data-value="short" class="active">Short</button>
          <button data-type="hair" data-value="long">Long</button>
          <button data-type="hair" data-value="curly">Curly</button>
        </div>

        <div class="group">
          <h3>Top</h3>
          <button data-type="top" data-value="tee" class="active">T‑Shirt</button>
          <button data-type="top" data-value="hoodie">Hoodie</button>
          <button data-type="top" data-value="dress">Dress</button>
        </div>

        <div class="group">
          <h3>Bottom</h3>
          <button data-type="bottom" data-value="jeans" class="active">Jeans</button>
          <button data-type="bottom" data-value="skirt">Skirt</button>
          <button data-type="bottom" data-value="shorts">Shorts</button>
        </div>

        <div class="group">
          <h3>Shoes</h3>
          <button data-type="shoes" data-value="sneakers" class="active">Sneakers</button>
          <button data-type="shoes" data-value="boots">Boots</button>
          <button data-type="shoes" data-value="heels">Heels</button>
        </div>

        <button class="next" id="goDate">Go On Date 💖</button>
      </div>
    </div>
  </div>

  <!-- Screen 2: Date -->
  <div class="screen" id="dateScreen">
    <div class="date">
      <h2>Your Date Night ✨</h2>
      <p>You look amazing 😍</p>

      <div class="scene">
        <div class="sun"></div>
        <div class="ground"></div>
        <div class="date-char" id="dateChar"></div>
      </div>

      <p id="rating"></p>

      <button class="restart" id="restart">Dress Up Again 🔁</button>
    </div>
  </div>
</div>

<script>
  const hair = document.getElementById("hair");
  const top = document.getElementById("top");
  const bottom = document.getElementById("bottom");
  const shoes = document.getElementById("shoes");

  const dressScreen = document.getElementById("dressScreen");
  const dateScreen = document.getElementById("dateScreen");
  const dateChar = document.getElementById("dateChar");
  const rating = document.getElementById("rating");

  let outfit = {
    hair: "short",
    top: "tee",
    bottom: "jeans",
    shoes: "sneakers"
  };

  // Handle buttons
  document.querySelectorAll(".group button").forEach(btn => {
    btn.addEventListener("click", () => {
      const type = btn.dataset.type;
      const value = btn.dataset.value;

      outfit[type] = value;

      // Update visuals
      if(type === "hair") hair.className = "hair " + value;
      if(type === "top") top.className = "top " + value;
      if(type === "bottom") bottom.className = "bottom " + value;
      if(type === "shoes") shoes.className = "shoes " + value;

      // Active button
      btn.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
    });
  });

  // Go to date
  document.getElementById("goDate").addEventListener("click", () => {
    dressScreen.classList.remove("active");
    dateScreen.classList.add("active");

    // Clone character
    const clone = document.getElementById("character").cloneNode(true);
    clone.style.transform = "scale(.7)";
    dateChar.innerHTML = "";
    dateChar.appendChild(clone);

    // Random rating
    const score = Math.floor(8 + Math.random()*3);
    rating.textContent = `Date Rating: ${score}/10 💘`;
  });

  // Restart
  document.getElementById("restart").addEventListener("click", () => {
    dateScreen.classList.remove("active");
    dressScreen.classList.add("active");
  });
</script>

</body>
</html>
