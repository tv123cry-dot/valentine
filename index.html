<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Be My Valentine?</title>
  <style>
    :root {
      --bg1: #ffdde1;
      --bg2: #ee9ca7;
      --card: rgba(255,255,255,0.7);
      --text: #2b2b2b;
      --yes: #22c55e;
      --no: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: radial-gradient(circle at 20% 20%, #fff 0 10%, transparent 11%),
                  radial-gradient(circle at 80% 30%, #fff 0 8%, transparent 9%),
                  radial-gradient(circle at 40% 80%, #fff 0 7%, transparent 8%),
                  linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow: hidden;
    }

    .card {
      width: min(680px, calc(100vw - 32px));
      padding: 28px;
      border-radius: 24px;
      background: var(--card);
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.55);
      position: relative;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: -0.02em;
      text-align: center;
    }

    p {
      margin: 0 0 18px;
      text-align: center;
      opacity: 0.85;
      font-size: 16px;
    }

    .stage {
      position: relative;
      height: min(380px, 55vh);
      border-radius: 20px;
      background: rgba(255,255,255,0.55);
      border: 1px dashed rgba(0,0,0,0.1);
      overflow: hidden;
      display: grid;
      place-items: center;
      margin-top: 18px;
    }

    .buttons {
      position: relative;
      width: 100%;
      height: 100%;
    }

    button {
      appearance: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      font-weight: 700;
      padding: 14px 22px;
      border-radius: 999px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.12);
      transition: transform 120ms ease, filter 120ms ease;
      user-select: none;
      touch-action: manipulation;
    }

    button:active { transform: scale(0.98); }

    #yesBtn {
      background: linear-gradient(180deg, #34d399, var(--yes));
      color: white;
      position: absolute;
      left: 50%;
      top: 62%;
      transform: translate(-120%, -50%);
    }

    #noBtn {
      background: linear-gradient(180deg, #fb7185, var(--no));
      color: white;
      position: absolute;
      left: 50%;
      top: 62%;
      transform: translate(20%, -50%);
    }

    .hearts {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.4;
      filter: blur(0.2px);
    }

    .heart {
      position: absolute;
      width: 16px;
      height: 16px;
      transform: rotate(45deg);
      background: #ff3b7a;
      border-radius: 4px;
      animation: floatUp linear infinite;
      opacity: 0.8;
    }
    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      background: #ff3b7a;
      border-radius: 50%;
    }
    .heart::before { left: -8px; top: 0; }
    .heart::after  { left: 0; top: -8px; }

    @keyframes floatUp {
      from { transform: translateY(20px) rotate(45deg); }
      to   { transform: translateY(-420px) rotate(45deg); }
    }

    .result {
      display: none;
      text-align: center;
      padding: 18px 10px 6px;
    }

    .result.show { display: block; }

    .result h2 {
      margin: 10px 0 6px;
      font-size: clamp(22px, 3vw, 30px);
    }

    .result .sub {
      margin: 0;
      opacity: 0.85;
      font-weight: 600;
    }

    /* Confetti canvas covers page */
    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }

    .tiny {
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.6;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <div class="card">
    <h1>Will you be my Valentine? 💘</h1>
    <p>Choose wisely…</p>

    <div class="stage" id="stage">
      <div class="hearts" id="hearts"></div>
      <div class="buttons" id="buttons">
        <button id="yesBtn">Yes 💚</button>
        <button id="noBtn">No 💔</button>
      </div>
    </div>

    <div class="result" id="result">
      <h2>YAYYYYY!!! 🥰🌹</h2>
      <p class="sub">You just made my whole day.</p>
    </div>

    <div class="tiny">Tip: send the link to your person 😌</div>
  </div>

  <script>
    // --- Floating hearts background inside stage ---
    const hearts = document.getElementById("hearts");
    const stage = document.getElementById("stage");

    function spawnHeart() {
      const h = document.createElement("div");
      h.className = "heart";
      const w = stage.clientWidth;
      const x = Math.random() * (w - 20);
      const dur = 3 + Math.random() * 4;
      const delay = Math.random() * 1.5;
      h.style.left = x + "px";
      h.style.bottom = (-10 - Math.random() * 30) + "px";
      h.style.animationDuration = dur + "s";
      h.style.animationDelay = delay + "s";
      h.style.opacity = (0.45 + Math.random() * 0.5).toFixed(2);
      h.style.transform = `rotate(45deg) scale(${0.7 + Math.random() * 0.9})`;
      hearts.appendChild(h);

      setTimeout(() => h.remove(), (dur + delay) * 1000 + 200);
    }

    setInterval(spawnHeart, 220);
    for (let i = 0; i < 12; i++) spawnHeart();

    // --- No button runs away ---
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const buttons = document.getElementById("buttons");

    // Place buttons nicely on load
    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

    function moveNoButtonAwayFrom(pointerX, pointerY) {
      const rect = buttons.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      // current center of NO
      const bx = btnRect.left + btnRect.width / 2;
      const by = btnRect.top + btnRect.height / 2;

      // vector away from pointer
      let dx = bx - pointerX;
      let dy = by - pointerY;
      const len = Math.hypot(dx, dy) || 1;
      dx /= len; dy /= len;

      // random wiggle so it feels playful
      const wiggle = () => (Math.random() - 0.5) * 0.7;
      dx += wiggle();
      dy += wiggle();

      // step distance scales with stage size
      const step = 120;

      // compute new position in BUTTONS coords
      const currentLeft = btnRect.left - rect.left;
      const currentTop  = btnRect.top  - rect.top;

      let newLeft = currentLeft + dx * step;
      let newTop  = currentTop  + dy * step;

      // keep inside the stage with padding
      const pad = 12;
      newLeft = clamp(newLeft, pad, rect.width - btnRect.width - pad);
      newTop  = clamp(newTop,  pad, rect.height - btnRect.height - pad);

      noBtn.style.left = newLeft + "px";
      noBtn.style.top  = newTop + "px";
      noBtn.style.transform = "none";
    }

    // initialize absolute positioning (convert from % transform layout)
    function absolutizeButtons() {
      const rect = buttons.getBoundingClientRect();
      [yesBtn, noBtn].forEach(btn => {
        const r = btn.getBoundingClientRect();
        btn.style.left = (r.left - rect.left) + "px";
        btn.style.top  = (r.top  - rect.top) + "px";
        btn.style.transform = "none";
      });
    }
    window.addEventListener("load", absolutizeButtons);
    window.addEventListener("resize", absolutizeButtons);

    // proximity detection (mouse + touch)
    function handlePointerMove(e) {
      const p = e.touches ? e.touches[0] : e;
      const x = p.clientX;
      const y = p.clientY;

      const btnRect = noBtn.getBoundingClientRect();
      const bx = btnRect.left + btnRect.width / 2;
      const by = btnRect.top + btnRect.height / 2;

      const dist = Math.hypot(bx - x, by - y);

      // If you're within range, it flees
      const fleeRadius = 130;
      if (dist < fleeRadius) moveNoButtonAwayFrom(x, y);
    }

    document.addEventListener("mousemove", handlePointerMove, { passive: true });
    document.addEventListener("touchstart", handlePointerMove, { passive: true });
    document.addEventListener("touchmove", handlePointerMove, { passive: true });

    // Optional: block clicking NO (in case someone manages)
    noBtn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      // extra flee on click attempt
      const r = noBtn.getBoundingClientRect();
      moveNoButtonAwayFrom(r.left, r.top);
    });

    // --- Confetti (simple canvas confetti) ---
    const confettiCanvas = document.getElementById("confetti");
    const ctx = confettiCanvas.getContext("2d");
    let W, H;

    function resizeConfetti() {
      W = confettiCanvas.width = window.innerWidth * devicePixelRatio;
      H = confettiCanvas.height = window.innerHeight * devicePixelRatio;
      confettiCanvas.style.width = window.innerWidth + "px";
      confettiCanvas.style.height = window.innerHeight + "px";
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }
    window.addEventListener("resize", resizeConfetti);
    resizeConfetti();

    const COLORS = ["#ff3b7a", "#ffcc00", "#22c55e", "#3b82f6", "#a855f7", "#fb7185"];
    let pieces = [];
    let animId = null;

    function burstConfetti(count = 180) {
      const originX = window.innerWidth / 2;
      const originY = window.innerHeight * 0.35;

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 7;
        pieces.push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 6,
          g: 0.18 + Math.random() * 0.12,
          size: 5 + Math.random() * 6,
          rot: Math.random() * Math.PI,
          vr: (Math.random() - 0.5) * 0.25,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          life: 180 + Math.random() * 60
        });
      }

      if (!animId) animateConfetti();
    }

    function animateConfetti() {
      animId = requestAnimationFrame(animateConfetti);
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      pieces = pieces.filter(p => p.life > 0);
      for (const p of pieces) {
        p.life -= 1;
        p.vy += p.g;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.7);
        ctx.restore();
      }

      if (pieces.length === 0) {
        cancelAnimationFrame(animId);
        animId = null;
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      }
    }

    // --- Yes button behavior ---
    const result = document.getElementById("result");

    yesBtn.addEventListener("click", () => {
      burstConfetti(240);
      result.classList.add("show");

      // Make it extra impossible to say no after yes 😌
      noBtn.style.display = "none";
      yesBtn.style.filter = "brightness(1.05)";
      yesBtn.textContent = "YES!!! 💞";
      yesBtn.disabled = true;
      yesBtn.style.cursor = "default";
    });
  </script>
</body>
</html>
